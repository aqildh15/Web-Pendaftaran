<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran</title>
</head>
<body bgcolor="lightyellow">
    <!-- navbar -->
    <nav>
        <center>
        <h2>
        <a href="formulirPendaftaran.html">Formulir Pendaftaran</a>
        <a href="tabelPeserta.html">Tabel Peserta</a>
        </h2>
        </center>
    </nav>
    <hr>

    <!-- content -->
     <h1 align="center">Formulir Pendaftaran</h1>
     <fieldset>
        <legend>Data Pribadi</legend>
        <form>
        <table bgcolor="#A482FF" width="100%">
            <tr>
                <td>
                    <label for="nama">Nama :</label> <br>
                    <input type="text" name="nama" id="nama">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="gender">Jenis Kelamin :</label> <br>
                    <input type="radio" name="gender" id="gender" value="pria"> Pria
                    <input type="radio" name="gender" id="gender" value="wanita"> Wanita
                </td>
            </tr>
            <tr>
                <td>
                    <label for="agama">Agama :</label> <br>
                    <select id="agama">
                        <optgroup label="Agama Mayoritas">
                        <option>Islam</option>
                        <option>Kristen</option>
                        <option>Katolik</option>
                        </optgroup>
                        <optgroup label="Agama Lain">
                        <option>Hindu</option>
                        <option>Buddha</option>
                        </optgroup>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="tempatLahir">Tempat Lahir :</label> <br>
                    <input type="text" name="tempatLahir" id="tempatLahir">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="tanggal">Tanggal Lahir :</label> <br>
                    <input type="date" name="tanggal" id="tanggal">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="alamat">Alamat :</label> <br>
                    <textarea cols="50" rows="10" id="alamat"></textarea>
                </td>
            </tr>
        </table>
     </fieldset>

     <fieldset>
        <legend>Pendidikan</legend>
        <table bgcolor="#FADADD" width="100%">
            <tr>
                <td>
                    <label for="sd">SD :</label> <br>
                    <input type="text" name="sd" id="sd"> 
                    <label for="masuksd">Masuk</label>
                    <input type="date" name="masuksd" id="masuksd">
                    <label for="keluarsd">Keluar</label>
                    <input type="date" name="keluarsd" id="keluarsd">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="smp">SMP :</label> <br>
                    <input type="text" name="smp" id="smp"> 
                    <label for="masuksmp">Masuk</label>
                    <input type="date" name="masuksmp" id="masuksmp">
                    <label for="keluarsmp">Keluar</label>
                    <input type="date" name="keluarsmp" id="keluarsmp">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="sma">SMA :</label> <br>
                    <input type="text" name="sma" id="sma"> 
                    <label for="masuksma">Masuk</label>
                    <input type="date" name="masuksma" id="masuksma">
                    <label for="keluarsma">Keluar</label>
                    <input type="date" name="keluarsma" id="keluarsma">
                </td>
            </tr>
        </table>
     </fieldset>

     <fieldset>
        <legend>Pelatihan</legend>
        <table bgcolor="#A482FF" width="100%">
            <tr>
                <td>
                    <label for="minat">Minat :</label> <br>
                    <input type="checkbox" name="minat" id="minat" value="HTML"> HTML 
                    <input type="checkbox" name="minat" id="minat" value="CSS"> CSS 
                    <input type="checkbox" name="minat" id="minat" value="JavaScript"> JavaScript 
                    <input type="checkbox" name="minat" id="minat" value="PHP"> PHP 
                </td>
            </tr>
            <tr>
                <td>
                    <label for="kompetensi">Kompetensi :</label> <br>
                    <input type="checkbox" name="kompetensi" id="kompetensi" value="HTML"> HTML 
                    <input type="checkbox" name="kompetensi" id="kompetensi" value="CSS"> CSS 
                    <input type="checkbox" name="kompetensi" id="kompetensi" value="JavaScript"> JavaScript 
                    <input type="checkbox" name="kompetensi" id="kompetensi" value="PHP"> PHP 
                </td>
            </tr>
        </table>
     </fieldset>

     <fieldset>
        <legend>Pilih Jurusan</legend>
        <table bgcolor="#FADADD" width="100%">
            <tr>
                <td>
                <select id="jurusan">
                <optgroup label="Teknik">
                <option>Teknik Informatika</option>
                <option>Teknik Elektro</option>
                <option>Teknik Industri</option>
                <option>Teknik Sipil</option>
                </optgroup>
                <optgroup label="Ekonomi">
                <option>Akuntansi</option>
                <option>Manajemen</option>
                <option>Perbankan</option>
                <option>Bisnis Digital</option>
                </optgroup>
                </select>
                </td>
            </tr>
        </table>
     </fieldset>

     <input type="submit" name="submit" value="submit">
     <input type="reset" name="reset" value="reset">
     </form>

</body>
</html>
